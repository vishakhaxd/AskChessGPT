<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AskChessGPT.com</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <!-- Logo and Title -->
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-chess-king"></i>
                </div>
                <h1>AskChessGPT</h1>
                <p class="tagline">Your AI Chess Companion</p>
            </div>

            <!-- Login Form -->
            <div class="login-content">
                <div class="auth-tabs">
                    <button class="tab-button active" data-tab="signin">Sign In</button>
                    <button class="tab-button" data-tab="signup">Sign Up</button>
                </div>

                <!-- Sign In Form -->
                <form id="signinForm" class="auth-form active">
                    <div class="form-group">
                        <label for="signin-email">
                            <i class="fas fa-envelope"></i>
                            Email
                        </label>
                        <input type="email" id="signin-email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signin-password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <input type="password" id="signin-password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-auth">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Form -->
                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label for="signup-email">
                            <i class="fas fa-envelope"></i>
                            Email
                        </label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="signup-password">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <input type="password" id="signup-password" placeholder="Create a password" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="signup-confirm">
                            <i class="fas fa-lock"></i>
                            Confirm Password
                        </label>
                        <input type="password" id="signup-confirm" placeholder="Confirm your password" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-primary btn-auth">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>or</span>
                </div>

                <!-- Google Sign In -->
                <button id="googleSignIn" class="btn btn-google">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </button>

                <!-- Error/Success Messages -->
                <div id="authMessage" class="auth-message" style="display: none;"></div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>Ready to improve your chess game with AI assistance?</p>
            </div>
        </div>

        <!-- Background Animation -->
        <div class="chess-pieces">
            <i class="fas fa-chess-pawn piece-1"></i>
            <i class="fas fa-chess-rook piece-2"></i>
            <i class="fas fa-chess-knight piece-3"></i>
            <i class="fas fa-chess-bishop piece-4"></i>
            <i class="fas fa-chess-queen piece-5"></i>
            <i class="fas fa-chess-king piece-6"></i>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
